server.port=8080
spring.application.name=java-backend

app.datastore.file=target/datastore.json
app.datastore.use-file-storage=false
app.mysql.url=${MYSQL_URL:jdbc:mysql://localhost:3306/java_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
app.mysql.username=${MYSQL_USERNAME:root}
app.mysql.password=${MYSQL_PASSWORD:rootpass}
app.mysql.driver-class-name=com.mysql.cj.jdbc.Driver
app.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
app.security.jwt.secret=${JWT_SECRET:change-this-in-production}
app.security.jwt.ttl-seconds=3600

app.stats.cache-ttl-ms=5000
app.security.api-key=dev-api-key
